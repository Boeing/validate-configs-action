---
name: 'Validate Config Files Action'
author: 'Boeing'
description: 'Github Action to validate config files in a repo using the config-file-validator tool'

inputs:
  search-paths:
    description: 'A space separated list of directories or files to scan'
    required: false
    default: '.'
  exclude-dirs:
    description: 'A comma separated list of directories to exclude in the search path. Example: "subdir1,subdir2"'
    required: false
    default: ""
  exclude-file-types:
    description: 'A comma separated list of file types to exclude. Example: "csv,json"'
    required: false
    default: ""
  file-types:
    description: 'A comma separated list of file types to validate. Cannot be used with exclude-file-types. Example: "json,yaml"'
    required: false
    default: ""
  depth:
    description: 'An integer value limiting the depth of recursion for the search paths. For example, setting depth to 0 would disable recursion'
    required: false
    default: ""
  reporter:
    description: 'Comma separated list of report formats with optional output paths. Format: type:path. Options are standard, json, junit, sarif, github (default "standard")'
    required: false
    default: "standard"
  group-by:
    description: 'A comma separated list of how to group the output. Options are filetype, directory, or pass-fail.'
    required: false
    default: ""
  quiet:
    description: 'If set to true, suppresses all output to stdout'
    required: false
    default: "false"
  globbing:
    description: 'If set to true, enables glob pattern matching for search paths'
    required: false
    default: "false"
  require-schema:
    description: 'If set to true, fail validation for files that support schema validation but do not declare a schema'
    required: false
    default: "false"
  no-schema:
    description: 'If set to true, disable all schema validation. Only syntax is checked. Cannot be used with require-schema, schema-map, or schemastore'
    required: false
    default: "false"
  schemastore:
    description: 'If set to true, enables automatic schema lookup using the embedded SchemaStore catalog with remote fetching'
    required: false
    default: "true"
  schemastore-path:
    description: 'Path to a local SchemaStore clone for automatic schema lookup (implies schemastore). For air-gapped environments'
    required: false
    default: ""
  type-map:
    description: 'Comma separated list of glob pattern to file type mappings. Format: pattern:type. Example: "**/inventory:ini,**/*.cfg:json"'
    required: false
    default: ""
  schema-map:
    description: 'Comma separated list of glob pattern to schema file mappings. Format: pattern:schema_path. Example: "**/package.json:schemas/pkg.json,**/config.xml:schemas/config.xsd"'
    required: false
    default: ""
  gitignore:
    description: 'If set to true, skip files and directories matched by .gitignore patterns'
    required: false
    default: "false"
  ignore-files:
    description: 'Comma-separated list of gitignore-style pattern files to skip during file discovery. Example: ".dockerignore,.prettierignore"'
    required: false
    default: ""
  only-changed:
    description: 'If set to true, only validate files changed in the current pull request'
    required: false
    default: "false"
  format-check:
    description: 'Format checking mode. warn: warning annotations, exit 0. strict: error annotations, exit 1. off: no format checking'
    required: false
    default: "warn"
  no-config:
    description: 'If set to true, disable all config file discovery (.cfv.toml, .editorconfig, .prettierrc, etc.)'
    required: false
    default: "false"
  config:
    description: 'Explicit path to .cfv.toml config file. Skips auto-discovery'
    required: false
    default: ""

outputs:
  files-validated:
    description: 'Total number of files scanned'
    value: ${{ steps.run.outputs.files-validated }}
  files-failed:
    description: 'Number of files that failed validation'
    value: ${{ steps.run.outputs.files-failed }}
  exit-code:
    description: 'Exit code from validation (0=success, 1=validation errors, 2=runtime error)'
    value: ${{ steps.run.outputs.exit-code }}
  files-unformatted:
    description: 'Number of files that need formatting'
    value: ${{ steps.run.outputs.files-unformatted }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        # Determine platform
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
        esac

        BINARY_NAME="entrypoint-${OS}-${ARCH}"

        # Path 1: Local build exists (CI on this repo — built by 'just build')
        LOCAL_BINARY="${{ github.action_path }}/bin/entrypoint"
        if [ -x "$LOCAL_BINARY" ]; then
          "$LOCAL_BINARY"
          exit $?
        fi

        # Path 2: Download pre-built binary from GitHub Release (consumer path)
        ACTION_VERSION="v3.0.0"  # Updated by release process
        ACTION_REPO="Boeing/validate-configs-action"
        RELEASE_URL="https://github.com/${ACTION_REPO}/releases/download/${ACTION_VERSION}"
        BINARY_PATH="${{ runner.temp }}/cfv-action"

        # Download binary and checksums
        curl -sL --fail "${RELEASE_URL}/${BINARY_NAME}" -o "$BINARY_PATH" || {
          echo "::error::Failed to download binary for ${OS}/${ARCH}"
          exit 2
        }
        curl -sL --fail "${RELEASE_URL}/checksums.txt" -o "${{ runner.temp }}/checksums.txt" || {
          echo "::error::Failed to download checksums"
          exit 2
        }

        # Verify checksum
        EXPECTED=$(grep "${BINARY_NAME}" "${{ runner.temp }}/checksums.txt" | awk '{print $1}')
        ACTUAL=$(shasum -a 256 "$BINARY_PATH" | awk '{print $1}')
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::Checksum verification failed for ${BINARY_NAME}"
          echo "::error::Expected: ${EXPECTED}"
          echo "::error::Actual:   ${ACTUAL}"
          exit 2
        fi

        chmod +x "$BINARY_PATH"
        "$BINARY_PATH"
        exit $?
      env:
        INPUT_SEARCH_PATHS: ${{ inputs.search-paths }}
        INPUT_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        INPUT_EXCLUDE_FILE_TYPES: ${{ inputs.exclude-file-types }}
        INPUT_FILE_TYPES: ${{ inputs.file-types }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_REPORTER: ${{ inputs.reporter }}
        INPUT_GROUP_BY: ${{ inputs.group-by }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_GLOBBING: ${{ inputs.globbing }}
        INPUT_REQUIRE_SCHEMA: ${{ inputs.require-schema }}
        INPUT_NO_SCHEMA: ${{ inputs.no-schema }}
        INPUT_SCHEMASTORE: ${{ inputs.schemastore }}
        INPUT_SCHEMASTORE_PATH: ${{ inputs.schemastore-path }}
        INPUT_TYPE_MAP: ${{ inputs.type-map }}
        INPUT_SCHEMA_MAP: ${{ inputs.schema-map }}
        INPUT_GITIGNORE: ${{ inputs.gitignore }}
        INPUT_IGNORE_FILES: ${{ inputs.ignore-files }}
        INPUT_ONLY_CHANGED: ${{ inputs.only-changed }}
        INPUT_FORMAT_CHECK: ${{ inputs.format-check }}
        INPUT_NO_CONFIG: ${{ inputs.no-config }}
        INPUT_CONFIG: ${{ inputs.config }}

branding:
  color: 'blue'
  icon: 'code'
